<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览 Tripo3D 树桩柜</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #fff;
    font-family: sans-serif; font-size: 14px; z-index: 10;
    background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px;
  }
</style>
</head>
<body>
<div id="info">Tripo3D 树桩柜 — 鼠标拖拽旋转，滚轮缩放</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(3, 3, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.5, 0);

// 灯光
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(5, 8, 5);
dir.castShadow = true;
scene.add(dir);

const fill = new THREE.DirectionalLight(0xffeedd, 0.5);
fill.position.set(-3, 2, -3);
scene.add(fill);

// 加载 GLB
const loader = new GLTFLoader();
loader.load('glb-preview/C05-树桩夜柜3d模型.glb', (gltf) => {
  const model = gltf.scene;
  
  // 自动计算边界框，居中并缩放
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 2 / maxDim;
  
  model.scale.set(scale, scale, scale);
  model.position.sub(center.clone().multiplyScalar(scale));
  model.position.y += size.y * scale / 2;
  
  scene.add(model);
  console.log('模型加载成功，尺寸:', size, '缩放后:', scale);
}, undefined, (err) => {
  console.error('加载失败:', err);
  document.getElementById('info').innerText = '加载失败，请检查文件路径';
});

// 地面网格
const grid = new THREE.GridHelper(10, 20, 0x444466, 0x222244);
scene.add(grid);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
