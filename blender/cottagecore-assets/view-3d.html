<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>森系自然风工作室 - 3D预览</title>
<style>
body { margin: 0; overflow: hidden; background: #e8e4e0; }
#info {
  position: absolute; top: 10px; left: 10px;
  font-family: sans-serif; font-size: 14px; color: #555;
  background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 6px;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">拖拽旋转 | 滚轮缩放 | 右键平移<br>森系自然风工作室 Cottagecore Scene</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e4e0);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(18, 16, 18);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;

// 灯光
const ambient = new THREE.AmbientLight(0xfff4e0, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff0d8, 1.5);
sun.position.set(10, 20, 10);
sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xd0e0f0, 0.4);
fill.position.set(-10, 10, -5);
scene.add(fill);

// 加载 GLB
const loader = new GLTFLoader();
loader.load('cottagecore-scene.glb', (gltf) => {
  const model = gltf.scene;
  scene.add(model);
  console.log('模型加载成功，物体数:', model.children.length);

  // 自动调整相机到合适距离
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * (Math.PI / 180);
  const cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2;
  camera.position.set(center.x + cameraZ * 0.8, center.y + cameraZ * 0.7, center.z + cameraZ * 0.8);
  camera.lookAt(center);
  controls.target.copy(center);
}, undefined, (error) => {
  console.error('加载失败:', error);
  document.getElementById('info').innerHTML += '<br><span style="color:red">加载失败: ' + error.message + '</span>';
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
